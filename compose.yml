services:
  database:
    image: postgres:16
    environment:
      POSTGRES_USER: porch
      POSTGRES_DB: porch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U porch -d porch"]
      interval: 5s
      timeout: 3s
      retries: 10
  porch:
    build: .
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://porch:${POSTGRES_PASSWORD}@database:5432/porch
      APP_ORIGIN: ${APP_ORIGIN:?Set the public HTTPS origin}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?Register a GitHub OAuth app}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?Set the GitHub OAuth secret}
      UPLOAD_DIR: /app/.local/uploads
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - uploads:/app/.local/uploads
    restart: unless-stopped
volumes:
  database:
  uploads:
